name: host-lock
on:
  push:
    branches: [main]
    paths: ['host-lock/**', '.github/workflows/host-lock.yml']
    tags: ['host-lock-v*']
  pull_request:
    paths: ['host-lock/**', '.github/workflows/host-lock.yml']
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        working-directory: host-lock
        run: shellcheck -x -s sh host-lock.sh host-lock && shellcheck tests/host-lock.sh
      - name: tests under dash and bash
        run: for s in dash bash; do HL_SHELL=$s bash host-lock/tests/host-lock.sh; done
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/host-lock-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the tag names the version in host-lock/VERSION
        run: test "${GITHUB_REF_NAME#host-lock-v}" = "$(cat host-lock/VERSION)"
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar czf "$GITHUB_REF_NAME.tar.gz" host-lock/host-lock.sh host-lock/host-lock host-lock/README.md host-lock/VERSION
          gh release create "$GITHUB_REF_NAME" "$GITHUB_REF_NAME.tar.gz" --title "$GITHUB_REF_NAME" --notes "host-lock $(cat host-lock/VERSION)"
