name: salty-suite
on:
  push:
    branches: [main]
    tags:
      - 'machine-env-v*'
      - 'pg-tune-v*'
      - 'deps-installer-v*'
      - 'artifact-store-v*'
  pull_request:
permissions:
  contents: write
jobs:
  test-linux:
    runs-on: [self-hosted, laplace, Salty-Suite]
    steps:
      - uses: actions/checkout@v4
      - name: Run Python unittest suites (Linux)
        run: |
          for d in host-lock machine-env pg-tune deps-installer artifact-store; do
            echo "=== $d ==="
            python3 -B -m unittest discover -s "$d/tests" -v
          done
